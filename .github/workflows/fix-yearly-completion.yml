name: Fix yearly completion display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</script>'
          patch = r'''\n/* TVOO yearly completion indicator */\n(function(){\n  function updateYearlyCompletion(){\n    if (!Array.isArray(window.allData)) return;\n    var total = window.allData.length;\n    var done = 0;\n    window.allData.forEach(function(item){\n      var n = parseFloat(String(item.progress ?? '').replace(',', '.').replace('%','').trim());\n      if (!isNaN(n)) {\n        if (n >= 0 && n <= 1) n = n * 100;\n        if (n >= 100) done++;\n      }\n    });\n    var pct = total ? (done / total) * 100 : 0;\n    var el = document.getElementById('yearlyCompletionPercent');\n    if (el) el.textContent = pct.toLocaleString('id-ID', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';\n  }\n  setInterval(updateYearlyCompletion, 300);\n  setTimeout(updateYearlyCompletion, 100);\n})();\n'''
          if 'TV00 yearly completion indicator' not in s:
              s = s.replace(marker, patch + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-yearly-completion.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix yearly completion percentage"
          git push
