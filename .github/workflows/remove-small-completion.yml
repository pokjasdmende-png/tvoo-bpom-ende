name: Remove small completion text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-small-completion:
    if: "!contains(github.event.head_commit.message, 'Remove small completion text')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove 84,62% text under the 11 count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<br><span id="completionRate" style="font-weight:800;color:#0b8e49">0.00% selesai</span>'
          new = ''
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Removed small completion-rate text.')
          else:
              print('Target text not found; no change needed.')
          PY

      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove small completion text"
          git push
