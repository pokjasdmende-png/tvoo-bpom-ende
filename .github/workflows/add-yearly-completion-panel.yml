name: Add yearly completion panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add yearly completion panel
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker_css = '.yearly-completion{'
          if marker_css not in s:
              css = '''\n.yearly-completion{margin:0 0 24px;background:linear-gradient(135deg,#07549b 0%,#12396f 58%,#0b8e49 100%);border-radius:18px;padding:25px 30px;color:#fff;box-shadow:0 8px 24px rgba(18,57,111,.18);display:flex;align-items:center;justify-content:space-between;gap:24px}.yearly-completion-title{font-size:18px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.yearly-completion-subtitle{font-size:13px;opacity:.9;margin-top:7px;line-height:1.5}.yearly-completion-value{text-align:right;min-width:230px}.yearly-completion-percent{font-size:54px;line-height:1;font-weight:900;letter-spacing:-2px}.yearly-completion-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-top:6px;opacity:.92}@media(max-width:720px){.yearly-completion{padding:20px;display:block;text-align:center}.yearly-completion-value{margin-top:15px;text-align:center}.yearly-completion-percent{font-size:46px}}\n'''
              s=s.replace('</style>',css+'</style>',1)

          marker_html = '<section class="yearly-completion"'
          if marker_html not in s:
              html='''\n<section class="yearly-completion">\n  <div><div class="yearly-completion-title">Persentase Penyelesaian Tahun Berjalan</div><div class="yearly-completion-subtitle">Persentase aspirasi yang telah mendapat arahan dibandingkan dengan seluruh aspirasi yang masuk pada tahun berjalan.</div></div>\n  <div class="yearly-completion-value"><div id="yearlyCompletionPercent" class="yearly-completion-percent">0,00%</div><div class="yearly-completion-label">Penyelesaian TVOO Tahun Berjalan</div></div>\n</section>\n'''
              s=s.replace('</section>\n<section class="panel">', '</section>'+html+'<section class="panel">', 1)

          marker_js = "document.getElementById('yearlyCompletionPercent').textContent"
          if marker_js not in s:
              old="document.getElementById('completionRate').textContent=completion+'% selesai'"
              new="document.getElementById('completionRate').textContent=completion+'% selesai';document.getElementById('yearlyCompletionPercent').textContent=completion.replace('.',',')+'%'"
              if old in s:
                  s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

      - name: Commit dashboard change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add yearly TVOO completion panel"
          git push
